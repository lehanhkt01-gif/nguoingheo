upstream nextjs_upstream {
    server web:3000;
    keepalive 32;
}

# 1. Tiếp nhận HTTP cổng 80 - Tự động chuyển hướng sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nguoingheo.easupso.com www.nguoingheo.easupso.com vinguoingheo.easupso.com localhost;

    # Cho phép xác thực Let's Encrypt Certbot nếu có
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Tiếp nhận HTTPS cổng 443 - Chuẩn Cloudflare Full (Strict)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nguoingheo.easupso.com www.nguoingheo.easupso.com vinguoingheo.easupso.com localhost;

    # Chứng chỉ Cloudflare Origin Certificate
    ssl_certificate /etc/nginx/ssl/easupso.pem;
    ssl_certificate_key /etc/nginx/ssl/easupso.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Bảo mật Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Cho phép upload file scan mộc đỏ đến 50MB
    client_max_body_size 50M;

    # Proxy tới Next.js container (web:3000)
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Timeout cho các báo cáo sao kê lớn
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Tối ưu hóa bộ đệm tĩnh cho Next.js assets
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }
}
