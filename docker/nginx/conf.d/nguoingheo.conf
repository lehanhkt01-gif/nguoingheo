upstream nextjs_upstream {
    server web:3000;
    keepalive 32;
}

# HTTP: Redirect toàn bộ sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nguoingheo.easupso.com www.nguoingheo.easupso.com;

    # Hỗ trợ xác thực Let's Encrypt Certbot nếu không dùng Cloudflare SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: nguoingheo.easupso.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nguoingheo.easupso.com www.nguoingheo.easupso.com;

    # Chứng chỉ SSL (Tự sinh hoặc do Cloudflare / Let's Encrypt cấp)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Bảo mật Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Cho phép upload file scan mộc đỏ đến 50MB
    client_max_body_size 50M;

    # Proxy tới Next.js container
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cho các báo cáo lớn
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache static files
    location /_next/static {
        proxy_pass http://nextjs_upstream;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
