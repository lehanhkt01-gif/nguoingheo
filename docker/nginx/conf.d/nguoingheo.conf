upstream nextjs_upstream {
    server web:3000;
    keepalive 32;
}

# Cấu hình Nginx Reverse Proxy đón tên miền nguoingheo.easupso.com tại cổng 80
server {
    listen 80;
    listen [::]:80;
    server_name nguoingheo.easupso.com www.nguoingheo.easupso.com vinguoingheo.easupso.com localhost;

    # Bảo mật Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Cho phép upload file scan mộc đỏ đến 50MB
    client_max_body_size 50M;

    # Hỗ trợ xác thực Let's Encrypt Certbot nếu cần
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy tới Next.js container (web:3000)
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cho các báo cáo sao kê lớn
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Tối ưu hóa bộ đệm tĩnh cho Next.js assets
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }
}
