version: '3.8'

services:
  # 1. Next.js 15 Standalone Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vinguoingheo_web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-EaSupSecureDb2026}@db:5432/${DB_NAME:-vinguoingheo_db}?schema=public
      - CASSO_SECURE_TOKEN=${CASSO_SECURE_TOKEN:-EaSup_Charity_2026_Secure_Token_Secret}
      - JWT_SECRET=${JWT_SECRET:-EaSup_Charity_JWT_Secret_Key_2026}
      - NEXT_PUBLIC_BIDV_ACCOUNT=8630100930
      - NEXT_PUBLIC_BIDV_BIN=970418
      - NEXT_PUBLIC_ACCOUNT_NAME=UY BAN MTTQ VN XA EA SUP
      - NEXT_PUBLIC_SITE_URL=https://nguoingheo.easupso.com
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_net

  # 2. Cơ sở dữ liệu PostgreSQL 16 (KHÔNG mở port 5432 ra ngoài Internet)
  db:
    image: postgres:16-alpine
    container_name: vinguoingheo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-EaSupSecureDb2026}
      POSTGRES_DB: ${DB_NAME:-vinguoingheo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vinguoingheo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  # 3. Nginx Reverse Proxy đón tên miền nguoingheo.easupso.com tại cổng 80
  nginx:
    image: nginx:alpine
    container_name: vinguoingheo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
    networks:
      - internal_net

  # 4. Dozzle - Trình xem log container thời gian thực tại cổng 8888
  dozzle:
    image: amir20/dozzle:latest
    container_name: vinguoingheo_dozzle
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_NO_ANALYTICS=true
    networks:
      - internal_net

volumes:
  postgres_data:
    driver: local

networks:
  internal_net:
    driver: bridge

