name: CI/CD Pipeline - Deploy to VPS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Kiểm tra mã nguồn và Test Build
  test-and-build:
    name: Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/vinguoingheo_db?schema=public"

  # 2. Tự Động Triển Khai Đến Máy Chủ VPS Gdata qua SSH
  deploy:
    name: Deploy to Production VPS
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Bắt đầu quá trình cập nhật mã nguồn trên VPS..."
            cd /var/www/vinguoingheo-easupso

            # Kéo mã nguồn mới nhất
            git pull origin main

            # Rebuild và khởi động lại containers không làm gián đoạn
            docker compose up -d --build --remove-orphans

            # Chạy migration cơ sở dữ liệu nếu có thay đổi
            docker compose exec -T web npx prisma migrate deploy

            echo "✅ Cập nhật thành công cổng thông tin Quỹ vì người nghèo Ea Súp!"
