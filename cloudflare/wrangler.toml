name = "nguoingheo-edge-api"
main = "workers/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Tên miền tùy chỉnh Cloudflare
routes = [
  { pattern = "nguoingheo.easupso.com/api/edge/*", zone_name = "easupso.com" }
]

# 1. Cloudflare D1 (Cơ sở dữ liệu quan hệ SQL phân tán tại Edge)
[[d1_databases]]
binding = "DB"
database_name = "nguoingheo_db"
database_id = "d1-nguoingheo-db-id-placeholder"
migrations_dir = "d1/migrations"

# 2. Cloudflare KV (Bộ nhớ đệm đếm số dư, rate limiting, phiên làm việc)
[[kv_namespaces]]
binding = "FUND_KV"
id = "kv-nguoingheo-stats-id-placeholder"

# 3. Cloudflare R2 (Lưu trữ hóa đơn VAT, chứng từ scan, ảnh nghiệm thu 0đ phí tải)
[[r2_buckets]]
binding = "PROOFS_BUCKET"
bucket_name = "nguoingheo-proofs"

# 4. Cloudflare Vectorize (Tìm kiếm ngữ nghĩa RAG cho AI Trợ lý Mặt trận)
[[vectorize]]
binding = "LEGAL_VECTORS"
index_name = "nguoingheo-legal-index"

# 5. Cloudflare Workers AI (Chạy mô hình Llama-3 & Embeddings trực tiếp)
[ai]
binding = "AI"

# 6. Biến môi trường
[vars]
ENVIRONMENT = "production"
SITE_DOMAIN = "nguoingheo.easupso.com"
BIDV_ACCOUNT_NUMBER = "8630100930"
BIDV_ACCOUNT_NAME = "UY BAN MTTQ VN XA EA SUP"
CASSO_WEBHOOK_SECRET = "casso_webhook_secure_secret_2026"
