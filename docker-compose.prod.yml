version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vinguoingheo_web
    restart: always
    expose:
      - "3000"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vinguoingheo_net

  postgres:
    image: postgres:16-alpine
    container_name: vinguoingheo_postgres
    restart: always
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-vinguoingheo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vinguoingheo_net

  redis:
    image: redis:7-alpine
    container_name: vinguoingheo_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - vinguoingheo_net

  nginx:
    image: nginx:alpine
    container_name: vinguoingheo_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - vinguoingheo_net

  backup:
    image: postgres:16-alpine
    container_name: vinguoingheo_backup
    restart: always
    env_file:
      - .env.production
    environment:
      PGHOST: postgres
      PGPORT: 5432
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chmod +x /backup.sh
        echo "0 0 * * * /backup.sh >> /backups/backup.log 2>&1" > /var/spool/cron/crontabs/root
        crond -f -l 2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vinguoingheo_net

networks:
  vinguoingheo_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backup_data:
    driver: local
