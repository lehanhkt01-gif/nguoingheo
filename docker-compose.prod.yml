services:
  # 1. Next.js 15 Standalone Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vinguoingheo_web
    restart: unless-stopped
    user: "0:0"
    env_file:
      - .env
    ports:
      - "3080:3000"
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-EaSupSecureDb2026}@db:5432/${DB_NAME:-vinguoingheo_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:-EaSup_Charity_JWT_Secret_Key_2026}
      - NEXT_PUBLIC_BIDV_ACCOUNT=8630100930
      - NEXT_PUBLIC_BIDV_BIN=970418
      - NEXT_PUBLIC_ACCOUNT_NAME=UY BAN MTTQ VN XA EA SUP
      - NEXT_PUBLIC_SITE_URL=https://nguoingheo.easupso.com
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_net

  # 2. Cơ sở dữ liệu PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: vinguoingheo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-EaSupSecureDb2026}
      POSTGRES_DB: ${DB_NAME:-vinguoingheo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vinguoingheo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  # 3. Dozzle - Trình xem log container thời gian thực tại cổng 8899
  dozzle:
    image: amir20/dozzle:latest
    container_name: vinguoingheo_dozzle
    restart: unless-stopped
    ports:
      - "${DOZZLE_PORT:-8899}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_NO_ANALYTICS=true
    networks:
      - internal_net

volumes:
  postgres_data:
    driver: local

networks:
  internal_net:
    driver: bridge
